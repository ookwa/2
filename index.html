<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ookwa 1.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --surface-2: #18181b;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #ef4444;
      --cyan: #f87171;
      --green: #4ade80;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg-motion {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #0a0a0b;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: orbFloat 18s ease-in-out infinite;
    }

    .bg-orb.o1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(239,68,68,.45), transparent 70%);
      top: -10%;
      left: 10%;
    }

    .bg-orb.o2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(185,28,28,.35), transparent 70%);
      bottom: -5%;
      right: 5%;
      animation-delay: -6s;
      animation-duration: 22s;
    }

    .bg-orb.o3 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(248,113,113,.25), transparent 70%);
      top: 40%;
      left: 45%;
      animation-delay: -12s;
      animation-duration: 16s;
    }

    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(40px,-30px) scale(1.08); }
      50% { transform: translate(-25px,35px) scale(.95); }
      75% { transform: translate(30px,15px) scale(1.04); }
    }

    .bg-grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(rgba(239,68,68,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239,68,68,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 40s linear infinite;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black, transparent);
    }

    @keyframes gridDrift {
      from { transform: translate(0,0); }
      to { transform: translate(48px,48px); }
    }

    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      z-index: 2;
    }

    .topbar, .sidebar-left, .sidebar-right, .chat-input-area {
      background: rgba(17,17,19,.85);
      backdrop-filter: blur(8px);
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    .topbar-logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(145deg,#ef4444,#991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(239,68,68,.35);
    }

    .topbar-logo-mark svg { width: 16px; height: 16px; }

    .topbar-logo {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .topbar-logo span {
      color: var(--accent);
      font-size: .75rem;
      margin-left: .3rem;
    }

    .topbar-right {
      font-size: .8rem;
      color: var(--muted);
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 180px 1fr 200px;
      overflow: hidden;
      min-height: 0;
    }

    .sidebar-left, .sidebar-right {
      padding: .85rem;
      overflow-y: auto;
    }

    .sidebar-left {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .85rem;
    }

    .sidebar-right {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-title {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .35rem;
    }

    .rating-box, .contact-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .8rem;
    }

    .rating-box h3 {
      font-size: .8rem;
      margin-bottom: .2rem;
    }

    .rating-box p {
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: .65rem;
    }

    .stars {
      display: flex;
      gap: .15rem;
      margin-bottom: .5rem;
    }

    .star {
      font-size: 1.25rem;
      cursor: pointer;
      color: #3f3f46;
      transition: .15s;
      user-select: none;
    }

    .star:hover, .star.active {
      color: #fbbf24;
      transform: scale(1.1);
    }

    .rating-feedback {
      font-size: .7rem;
      color: var(--green);
      min-height: 1em;
    }

    .rating-avg {
      margin-top: .4rem;
      font-size: .7rem;
      color: var(--muted);
    }

    .rating-avg strong { color: #fbbf24; }

    .contact-card {
      margin-top: auto;
    }

    .contact-card h3 {
      font-size: .75rem;
      margin-bottom: .55rem;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      gap: .05rem;
      margin-bottom: .55rem;
      font-size: .7rem;
    }

    .contact-item:last-child { margin-bottom: 0; }

    .contact-item label {
      color: var(--muted);
      font-size: .6rem;
    }

    .contact-item a {
      color: var(--cyan);
      text-decoration: none;
      word-break: break-all;
    }

    .contact-item a:hover { text-decoration: underline; }

    .chat-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.15rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .msg {
      max-width: 85%;
      padding: .7rem .95rem;
      border-radius: 14px;
      font-size: .9rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.ai .ai-label {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--accent);
      margin-bottom: .25rem;
    }

    .msg.system {
      align-self: center;
      color: var(--muted);
      font-size: .8rem;
      max-width: 90%;
      text-align: center;
    }

    .typing {
      align-self: flex-start;
      padding: .7rem .95rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: none;
      margin: 0 1.35rem .35rem;
      align-items: center;
      gap: .55rem;
    }

    .typing.visible { display: flex; }

    .typing-label {
      font-size: .65rem;
      font-weight: 600;
      color: var(--accent);
    }

    .typing-dots { display: flex; gap: 4px; }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .chat-input-area {
      padding: .75rem 1.15rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: .55rem;
      align-items: flex-end;
    }

    .chat-input-area textarea {
      flex: 1;
      min-width: 0;
      padding: .65rem .95rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: .9rem;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 40px;
      line-height: 1.4;
    }

    .chat-input-area textarea:focus { border-color: var(--accent); }
    .chat-input-area textarea::placeholder { color: var(--muted); }

    .tts-btn, .attract-btn, .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .15s;
    }

    .tts-btn, .attract-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
    }

    .tts-btn.on, .attract-btn.on {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(239,68,68,.12);
    }

    .send-btn {
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1.05rem;
    }

    .send-btn:hover { filter: brightness(1.1); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .65rem;
    }

    .clear-history {
      font-size: .7rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
    }

    .clear-history:hover { color: #f87171; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      flex: 1;
    }

    .history-item {
      padding: .55rem .65rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: .75rem;
    }

    .history-item:hover { border-color: var(--border-hover); }

    .history-item .q {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .1rem;
    }

    .history-item .time {
      font-size: .6rem;
      color: var(--muted);
    }

    .history-empty {
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
      margin-top: 1.25rem;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .sidebar-left, .sidebar-right { display: none; }
    }

    @media (max-width: 480px) {
      .chat-messages { padding: .8rem; }
      .chat-input-area { padding: .6rem; gap: .35rem; }
      .msg { max-width: 92%; }
      .tts-btn, .attract-btn, .send-btn { width: 36px; height: 40px; }
    }
  </style>
</head>

<body>
  <div class="bg-motion" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
  </div>

  <canvas id="particle-canvas"></canvas>

  <div id="app">
    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>
            <circle cx="12" cy="12" r="3.5" fill="white"/>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
          </svg>
        </div>
        <div class="topbar-logo">Ookwa <span>1.0</span></div>
      </div>
      <div class="topbar-right">AI assistant</div>
    </div>

    <div class="main">
      <aside class="sidebar-left">
        <div>
          <div class="sidebar-title">Rate</div>
          <div class="rating-box">
            <h3>How good?</h3>
            <p>Tap a star</p>
            <div class="stars" id="stars">
              <span class="star" data-val="1">★</span>
              <span class="star" data-val="2">★</span>
              <span class="star" data-val="3">★</span>
              <span class="star" data-val="4">★</span>
              <span class="star" data-val="5">★</span>
            </div>
            <div class="rating-feedback" id="rating-feedback"></div>
            <div class="rating-avg" id="rating-avg"></div>
          </div>
        </div>

        <div class="contact-card">
          <h3>Contact</h3>
          <div class="contact-item">
            <label>Email</label>
            <a href="mailto:kypton335@gmail.com">kypton335@gmail.com</a>
          </div>
          <div class="contact-item">
            <label>Discord</label>
            <span>@oowa</span>
          </div>
          <div class="contact-item">
            <label>Alt</label>
            <span>@oowa</span>
          </div>
        </div>
      </aside>

      <div class="chat-area">
        <div class="chat-messages" id="messages">
          <div class="msg system">Ookwa 1.0 — ask anything. Turn on 🔊 for voice answers.</div>
        </div>

        <div class="typing" id="typing">
          <span class="typing-label">OOKWA 1.0</span>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>

        <div class="chat-input-area">
          <textarea id="user-input" placeholder="Message Ookwa..." rows="1"></textarea>
          <button class="attract-btn" id="attract-btn" title="Toggle particle attraction">⊕</button>
          <button class="tts-btn" id="tts-btn" title="Toggle voice answers">🔇</button>
          <button class="send-btn" id="send-btn" aria-label="Send message">➤</button>
        </div>
      </div>

      <aside class="sidebar-right">
        <div class="history-header">
          <div class="sidebar-title">History</div>
          <button class="clear-history" id="clear-history">Clear</button>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">Questions appear here</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ========== PARTICLES ==========
    window.ookwaAttract = false;

    try {
      window.ookwaAttract = localStorage.getItem('ookwa_attract') === '1';
    } catch (e) {}

    (function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');

      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      const mouse = { x: w / 2, y: h / 2 };
      const particles = [];
      const COUNT = 45;

      for (let i = 0; i < COUNT; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - .5) * .5,
          vy: (Math.random() - .5) * .5,
          r: 2.5 + Math.random() * 3
        });
      }

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      document.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      function tick() {
        ctx.clearRect(0, 0, w, h);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          p.x = Math.max(0, Math.min(w, p.x));
          p.y = Math.max(0, Math.min(h, p.y));

          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;

          if (dist < 100) {
            const strength = (window.ookwaAttract ? .025 : -.025) * (1 - dist / 100);
            p.vx += dx / dist * strength;
            p.vy += dy / dist * strength;
          }

          p.vx *= .96;
          p.vy *= .96;

          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);

          if (speed > 2.2) {
            p.vx = p.vx / speed * 2.2;
            p.vy = p.vy / speed * 2.2;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = '#ef4444';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(239,68,68,.2)';
          ctx.fill();
        }

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const d = Math.sqrt(dx * dx + dy * dy);

            if (d < 120) {
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = 'rgba(239,68,68,' + (.4 * (1 - d / 120)) + ')';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(tick);
      }

      tick();
    })();

    // ========== ELEMENTS ==========
    const messagesEl = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingEl = document.getElementById('typing');
    const ttsBtn = document.getElementById('tts-btn');
    const attractBtn = document.getElementById('attract-btn');
    const historyList = document.getElementById('history-list');

    let ttsOn = false;
    let turnCount = 0;

    try {
      ttsOn = localStorage.getItem('ookwa_tts') === '1';
    } catch (e) {}

    // ========== PARTICLE BUTTON ==========
    function updateAttractBtn() {
      const on = !!window.ookwaAttract;

      attractBtn.classList.toggle('on', on);
      attractBtn.title = on ? 'Attract particles' : 'Repel particles';
      attractBtn.textContent = on ? '⊙' : '⊕';
    }

    updateAttractBtn();

    attractBtn.addEventListener('click', () => {
      window.ookwaAttract = !window.ookwaAttract;

      try {
        localStorage.setItem('ookwa_attract', window.ookwaAttract ? '1' : '0');
      } catch (e) {}

      updateAttractBtn();
    });

    // ========== VOICE ==========
    function updateTtsBtn() {
      ttsBtn.classList.toggle('on', ttsOn);
      ttsBtn.title = ttsOn ? 'Turn voice off' : 'Turn voice on';
      ttsBtn.textContent = ttsOn ? '🔊' : '🔇';
    }

    updateTtsBtn();

    ttsBtn.onclick = () => {
      ttsOn = !ttsOn;

      try {
        localStorage.setItem('ookwa_tts', ttsOn ? '1' : '0');
      } catch (e) {}

      updateTtsBtn();

      if (!ttsOn && window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
    };

    function speakText(text) {
      if (!ttsOn || !window.speechSynthesis) return;

      window.speechSynthesis.cancel();

      const clean = String(text)
        .replace(/\*\*/g, '')
        .replace(/\n+/g, '. ');

      const utter = new SpeechSynthesisUtterance(clean);
      utter.rate = 1.05;
      utter.pitch = 1;

      const voices = window.speechSynthesis.getVoices();

      const voice =
        voices.find(v => /^en/i.test(v.lang) && /google|microsoft|samantha|daniel/i.test(v.name)) ||
        voices.find(v => /^en/i.test(v.lang));

      if (voice) utter.voice = voice;

      window.speechSynthesis.speak(utter);
    }

    // ========== MATH ==========
    function tryMath(raw, q) {
      const match = raw.match(
        /^\s*(-?\d+(?:\.\d+)?)\s*([+\-*/×÷])\s*(-?\d+(?:\.\d+)?)\s*\??\s*$/
      );

      if (match) {
        const a = Number(match[1]);
        const b = Number(match[3]);
        const op = match[2];

        if ((op === '/' || op === '÷') && b === 0) {
          return "You can't divide a number by zero.";
        }

        const operations = {
          '+': () => a + b,
          '-': () => a - b,
          '*': () => a * b,
          '×': () => a * b,
          '/': () => a / b,
          '÷': () => a / b
        };

        const result = operations[op]();

        return 'The answer is ' + Number(result.toPrecision(10)) + '.';
      }

      const looksLikeMath =
        /^[\d\s+\-*/().%^]+$/.test(raw) ||
        /\d\s*[\+\-*/x×÷^%]\s*\d/i.test(q) ||
        /^(what(?:'s| is)|calculate|compute|solve|eval|math)\b/i.test(q) ||
        /\b(plus|minus|times|multiplied|divided|squared|cubed|percent)\b/i.test(q);

      if (!looksLikeMath) return null;

      let expr = raw
        .replace(/^(what(?:'s| is)|calculate|compute|solve|eval|math)\s+/i, '')
        .replace(/\?+$/g, '')
        .trim();

      expr = expr
        .replace(/\bmultiplied by\b/gi, '*')
        .replace(/\bdivided by\b/gi, '/')
        .replace(/\bplus\b/gi, '+')
        .replace(/\bminus\b/gi, '-')
        .replace(/\btimes\b/gi, '*')
        .replace(/\bsquared\b/gi, '**2')
        .replace(/\bcubed\b/gi, '**3')
        .replace(/\bto the power of\b/gi, '**')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\^/g, '**');

      // Only permit arithmetic characters.
      if (!/^[\d\s+\-*/().%]+$/.test(expr) || !/\d/.test(expr)) {
        return null;
      }

      try {
        // The expression is restricted to numeric arithmetic characters.
        const result = Function('"use strict"; return (' + expr + ')')();

        if (typeof result === 'number' && Number.isFinite(result)) {
          return 'The answer is ' + Number(result.toPrecision(10)) + '.';
        }
      } catch (e) {}

      return null;
    }

    // ========== OOKWA REPLY ==========
    function ookwaReply(input) {
      const text = input.trim();
      const msg = text.toLowerCase();

      turnCount++;

      // Math first, so arithmetic questions get calculated.
      const mathResult = tryMath(text, msg);
      if (mathResult) return mathResult;

      const replies = [
        {
          test: /^(hi|hello|hey|yo|sup|what's up)\b/i,
          answer: () => "Hey! What's up? I'm Ookwa. What can I help you with?"
        },
        {
          test: /\b(your name|who are you|what are you)\b/i,
          answer: () => "I'm Ookwa, your AI assistant. I can help answer questions, explain things, brainstorm ideas, and write code."
        },
        {
          test: /\bhow are you\b|\bhow's it going\b/i,
          answer: () => "I'm ready to help! What's on your mind?"
        },
        {
          test: /\b(thank you|thanks|ty)\b/i,
          answer: () => "You're welcome! Let me know if you need anything else."
        },
        {
          test: /\b(bye|goodbye|see you)\b/i,
          answer: () => "See you later! Feel free to come back whenever you need help."
        },
        {
          test: /\b(time|date|today)\b/i,
          answer: () => "Today's date is " + new Date().toLocaleDateString() + "."
        },
        {
          test: /\b(joke|make me laugh)\b/i,
          answer: () => {
            const jokes = [
              "Why do programmers prefer dark mode? Because light attracts bugs.",
              "Why did the computer go to the doctor? It caught a virus.",
              "Why was the JavaScript developer sad? Because they didn't know how to null their feelings.",
              "I told my computer I needed a break. It said, 'No problem, I'll go to sleep.'"
            ];

            return jokes[Math.floor(Math.random() * jokes.length)];
          }
        },
        {
          test: /\b(minecraft|smp|server|plugin)\b/i,
          answer: () => "I can help with Minecraft servers, SMP ideas, plugins, commands, permissions, configuration files, and troubleshooting. Tell me exactly what you're trying to do."
        },
        {
          test: /\b(html|css|javascript|python|coding|code|programming|error|bug)\b/i,
          answer: () => "I can help you write code, debug errors, explain how something works, or improve an existing project. Send me your code and tell me what you want it to do."
        },
        {
          test: /\b(sad|upset|stressed|angry|lonely|bad day)\b/i,
          answer: () => "I'm sorry things feel difficult right now. Want to tell me what happened? I'll listen and try to help."
        },
        {
          test: /\b(help|what can you do)\b/i,
          answer: () => "I can help with questions, writing, coding, gaming, schoolwork, ideas, explanations, and problem-solving. Ask me anything!"
        }
      ];

      const match = replies.find(item => item.test.test(text));
      if (match) return match.answer();

      if (/^(why)\b/i.test(msg)) {
        return "There could be a few reasons. Give me a little more context about what you're asking, and I'll help explain why.";
      }

      if (/^(how)\b/i.test(msg)) {
        return "I'll help you work through it step by step. Can you give me a little more detail about what you're trying to do?";
      }

      if (/^(what|who|when|where|which)\b/i.test(msg)) {
        return "I want to give you an accurate answer. Could you add a little context to your question so I understand exactly what you mean?";
      }

      if (text.endsWith('?')) {
        return "That's a good question. Tell me a little more about the situation, and I'll help you figure it out.";
      }

      return "I hear you. Tell me a little more about what you mean, and I'll do my best to help.";
    }

    // ========== CHAT MESSAGES ==========
    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;

      if (type === 'ai') {
        const label = document.createElement('div');
        label.className = 'ai-label';
        label.textContent = 'OOKWA 1.0';

        const body = document.createElement('span');
        body.className = 'ai-body';

        div.append(label, body);
      } else {
        div.textContent = text;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      return div;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function typeMessage(div, fullText) {
      const body = div.querySelector('.ai-body');
      if (!body) return Promise.resolve();

      return new Promise(resolve => {
        let i = 0;
        const speed = 8 + Math.random() * 6;

        function tick() {
          if (i <= fullText.length) {
            body.innerHTML = escapeHtml(fullText.slice(0, i))
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\n/g, '<br>');

            messagesEl.scrollTop = messagesEl.scrollHeight;
            i++;

            setTimeout(tick, speed);
          } else {
            resolve();
          }
        }

        tick();
      });
    }

    // ========== SEND MESSAGE ==========
    let isSending = false;

    async function sendMessage() {
      const text = userInput.value.trim();

      if (!text || isSending) return;

      isSending = true;
      sendBtn.disabled = true;

      addMessage(text, 'user');

      userInput.value = '';
      userInput.style.height = 'auto';

      saveToHistory(text);

      typingEl.classList.add('visible');
      messagesEl.scrollTop = messagesEl.scrollHeight;

      setTimeout(async () => {
        try {
          typingEl.classList.remove('visible');

          const reply = ookwaReply(text);
          const aiDiv = addMessage('', 'ai');

          speakText(reply);
          await typeMessage(aiDiv, reply);
        } catch (error) {
          typingEl.classList.remove('visible');
          addMessage('Something went wrong. Please try again.', 'system');
          console.error('Ookwa error:', error);
        } finally {
          isSending = false;
          sendBtn.disabled = false;
          userInput.focus();
        }
      }, 300 + Math.random() * 300);
    }

    sendBtn.onclick = sendMessage;

    userInput.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    userInput.oninput = () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    };

    // ========== HISTORY ==========
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem('ookwa_history') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveToHistory(question) {
      let hist = getHistory();

      hist.unshift({ q: question, t: Date.now() });
      hist = hist.slice(0, 50);

      try {
        localStorage.setItem('ookwa_history', JSON.stringify(hist));
      } catch (e) {}

      renderHistory();
    }

    function renderHistory() {
      const hist = getHistory();
      historyList.innerHTML = '';

      if (!hist.length) {
        historyList.innerHTML = '<div class="history-empty">Questions appear here</div>';
        return;
      }

      hist.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';

        const question = document.createElement('div');
        question.className = 'q';
        question.textContent = item.q;

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = new Date(item.t).toLocaleString([], {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        div.append(question, time);

        div.onclick = () => {
          userInput.value = item.q;
          userInput.focus();
        };

        historyList.appendChild(div);
      });
    }

    document.getElementById('clear-history').onclick = () => {
      try {
        localStorage.removeItem('ookwa_history');
      } catch (e) {}

      renderHistory();
    };

    // ========== RATINGS ==========
    const stars = document.querySelectorAll('.star');
    const ratingFeedback = document.getElementById('rating-feedback');
    const ratingAvg = document.getElementById('rating-avg');

    function setStars(val) {
      stars.forEach(star => {
        star.classList.toggle('active', Number(star.dataset.val) <= val);
      });
    }

    function loadRating() {
      try {
        const saved = localStorage.getItem('ookwa_rating');

        if (saved) {
          setStars(Number(saved));
          ratingFeedback.textContent = 'Thanks!';
        }
      } catch (e) {}

      updateAvg();
    }

    stars.forEach(star => {
      star.onclick = () => {
        const val = Number(star.dataset.val);

        try {
          localStorage.setItem('ookwa_rating', val);

          let ratings = JSON.parse(
            localStorage.getItem('ookwa_ratings_list') || '[]'
          );

          ratings.push(val);
          ratings = ratings.slice(-100);

          localStorage.setItem('ookwa_ratings_list', JSON.stringify(ratings));
        } catch (e) {}

        setStars(val);

        ratingFeedback.textContent = [
          '', 'Not great', 'Okay', 'Good', 'Really good', 'Amazing'
        ][val];

        updateAvg();
      };

      star.onmouseenter = () => {
        setStars(Number(star.dataset.val));
      };
    });

    document.getElementById('stars').onmouseleave = () => {
      let saved = null;

      try {
        saved = localStorage.getItem('ookwa_rating');
      } catch (e) {}

      if (saved) {
        setStars(Number(saved));
      } else {
        stars.forEach(star => star.classList.remove('active'));
      }
    };

    function updateAvg() {
      let ratings = [];

      try {
        ratings = JSON.parse(
          localStorage.getItem('ookwa_ratings_list') || '[]'
        );
      } catch (e) {}

      if (!ratings.length) {
        ratingAvg.textContent = '';
        return;
      }

      const avg = (
        ratings.reduce((a, b) => a + b, 0) / ratings.length
      ).toFixed(1);

      ratingAvg.textContent = 'Average rating: ' + avg + ' (' + ratings.length + ')';
    }

    // ========== INITIALIZE ==========
    renderHistory();
    loadRating();
  </script>
</body>
</html>
