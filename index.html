<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Meet Ookwa, your personal AI assistant.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23fb7185'/%3E%3Cstop offset='1' stop-color='%23b91c1c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b090b'/%3E%3Crect x='3' y='3' width='58' height='58' rx='14' fill='url(%23g)'/%3E%3Cpath d='M20 24h24v16a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z' fill='white'/%3E%3Cpath d='M20 29h-4v7a5 5 0 0 0 5 5M44 29h4v7a5 5 0 0 1-5 5' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M26 31v7m12-7v7' stroke='%23c02635' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Ookwa">
<title>Ookwa 1.0 — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:rgba(18,18,22,.82);--surface-2:rgba(27,27,33,.88);--surface-3:#222228;--border:rgba(255,255,255,.08);--border-hover:rgba(248,113,113,.45);--text:#fafafa;--muted:#9696a3;--accent:#ef4444;--accent-2:#fb7185;--accent-grad-1:#f05252;--accent-grad-2:#c52638;--user-msg-grad-1:#dc353f;--user-msg-grad-2:#a91e30;--orb-1:#991b1b;--orb-2:#7f1d1d;--orb-3:#be123c;--particle-color:#fb646b;--particle-line-rgb:239,68,68;--green:#4ade80;--shadow:0 12px 40px rgba(0,0,0,.35)}
[data-theme=blue]{--bg:#030712;--surface:rgba(15,23,42,.82);--surface-2:rgba(30,41,59,.88);--surface-3:#1e293b;--border-hover:rgba(56,189,248,.45);--text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--accent-2:#60a5fa;--accent-grad-1:#3b82f6;--accent-grad-2:#1d4ed8;--user-msg-grad-1:#2563eb;--user-msg-grad-2:#1e40af;--orb-1:#1e3a8a;--orb-2:#1e40af;--orb-3:#0284c7;--particle-color:#60a5fa;--particle-line-rgb:59,130,246}
[data-theme=purple]{--bg:#090514;--surface:rgba(23,15,38,.82);--surface-2:rgba(39,27,61,.88);--surface-3:#2d1f47;--border-hover:rgba(192,132,252,.45);--text:#faf5ff;--muted:#a855f7;--accent:#a855f7;--accent-2:#c084fc;--accent-grad-1:#a855f7;--accent-grad-2:#7e22ce;--user-msg-grad-1:#9333ea;--user-msg-grad-2:#6b21a8;--orb-1:#581c87;--orb-2:#3b0764;--orb-3:#7e22ce;--particle-color:#c084fc;--particle-line-rgb:168,85,247}
[data-theme=black]{--bg:#000;--surface:rgba(10,10,10,.9);--surface-2:rgba(20,20,20,.9);--surface-3:#181818;--border:rgba(255,255,255,.12);--border-hover:rgba(255,255,255,.4);--text:#fff;--muted:#888;--accent:#d4d4d8;--accent-2:#fff;--accent-grad-1:#3f3f46;--accent-grad-2:#18181b;--user-msg-grad-1:#27272a;--user-msg-grad-2:#09090b;--orb-1:#18181b;--orb-2:#27272a;--orb-3:#111113;--particle-color:#fff;--particle-line-rgb:255,255,255}
[data-theme=white]{--bg:#f8fafc;--surface:rgba(255,255,255,.88);--surface-2:rgba(241,245,249,.92);--surface-3:#e2e8f0;--border:rgba(0,0,0,.1);--border-hover:rgba(37,99,235,.4);--text:#0f172a;--muted:#64748b;--accent:#2563eb;--accent-2:#3b82f6;--accent-grad-1:#3b82f6;--accent-grad-2:#1d4ed8;--user-msg-grad-1:#2563eb;--user-msg-grad-2:#1d4ed8;--orb-1:#dbeafe;--orb-2:#e0e7ff;--orb-3:#f1f5f9;--particle-color:#2563eb;--particle-line-rgb:37,99,235}
[data-theme=green]{--bg:#02120a;--surface:rgba(10,31,20,.82);--surface-2:rgba(18,48,30,.88);--surface-3:#183d27;--border-hover:rgba(74,222,128,.45);--text:#f0fdf4;--muted:#86efac;--accent:#22c55e;--accent-2:#4ade80;--accent-grad-1:#22c55e;--accent-grad-2:#15803d;--user-msg-grad-1:#16a34a;--user-msg-grad-2:#166534;--orb-1:#14532d;--orb-2:#052e16;--orb-3:#15803d;--particle-color:#4ade80;--particle-line-rgb:34,197,94}
[data-theme=cyan]{--bg:#041318;--surface:rgba(11,34,43,.82);--surface-2:rgba(18,51,64,.88);--surface-3:#164354;--border-hover:rgba(34,211,238,.45);--text:#ecfeff;--muted:#67e8f9;--accent:#06b6d4;--accent-2:#22d3ee;--accent-grad-1:#06b6d4;--accent-grad-2:#0e7490;--user-msg-grad-1:#0891b2;--user-msg-grad-2:#155e75;--orb-1:#164e63;--orb-2:#083344;--orb-3:#0e7490;--particle-color:#22d3ee;--particle-line-rgb:6,182,212}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
html[data-theme=white]{color-scheme:light}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px}
.bg-motion{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% -25%,var(--orb-1),transparent 55%),var(--bg)}
.bg-grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:40px 40px;animation:gridDrift 55s linear infinite;mask-image:radial-gradient(ellipse at center,#000,transparent 70%)}
.bg-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.35;animation:orbFloat 22s ease-in-out infinite}
.o1{width:340px;height:340px;background:var(--orb-1);top:-200px;left:10%}
.o2{width:280px;height:280px;background:var(--orb-2);bottom:-190px;right:5%;animation-delay:-8s}
.o3{width:220px;height:220px;background:var(--orb-3);top:40%;left:40%;opacity:.13;animation-delay:-12s}
@keyframes orbFloat{50%{transform:translate(30px,-20px) scale(1.08)}}
@keyframes gridDrift{to{transform:translate(40px,40px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#particle-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.65}

.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;place-items:center;padding:16px;transition:opacity .3s,visibility .3s}
.modal-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.modal-card{width:min(100%,340px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:fadeIn .4s both;text-align:center}
.modal-logo{width:42px;height:42px;margin:0 auto 12px;border-radius:13px;background:linear-gradient(145deg,var(--accent-grad-1),var(--accent-grad-2));display:grid;place-items:center}
.modal-logo svg{width:22px;height:22px}
.modal-card h2{font-size:1.15rem;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.modal-card p{font-size:.78rem;color:var(--muted);margin-bottom:14px}
.modal-form{display:flex;flex-direction:column;gap:10px;text-align:left}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.66rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.form-group input{padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.85rem}
.form-group input:focus{border-color:var(--accent);outline:none}
.modal-btn{padding:10px;border:0;border-radius:10px;background:linear-gradient(145deg,var(--accent-grad-1),var(--accent-grad-2));color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;transition:transform .18s,filter .18s}
.modal-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.topbar{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border)}
.topbar-brand,.topbar-actions{display:flex;align-items:center;gap:10px}
.topbar-logo-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,var(--accent-grad-1),var(--accent-grad-2));display:grid;place-items:center;box-shadow:inset 0 1px rgba(255,255,255,.22)}
.topbar-logo-mark svg{width:17px;height:17px}
.topbar-logo{font-size:.98rem;font-weight:800;letter-spacing:-.5px}
.topbar-logo span{font-size:.62rem;font-weight:600;color:var(--accent-2);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:1px}
.rate-page-link{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--border-hover);border-radius:8px;background:linear-gradient(135deg,var(--accent-grad-1),var(--accent-grad-2));color:#fff;text-decoration:none;font-size:.7rem;font-weight:700;white-space:nowrap;transition:transform .18s,filter .18s}
.rate-page-link:hover{transform:translateY(-1px);filter:brightness(1.1)}
.theme-picker-wrapper{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 7px;border-radius:9px}
.theme-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.theme-dot:hover,.theme-dot.active{transform:scale(1.2);border-color:var(--text)}
.theme-dot[data-set=red]{background:#ef4444}.theme-dot[data-set=blue]{background:#3b82f6}.theme-dot[data-set=purple]{background:#a855f7}.theme-dot[data-set=green]{background:#22c55e}.theme-dot[data-set=cyan]{background:#06b6d4}.theme-dot[data-set=black]{background:#18181b}.theme-dot[data-set=white]{background:#f8fafc;border:1px solid #ccc}

.user-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent-grad-1),var(--accent-grad-2));display:grid;place-items:center;font-weight:700;font-size:.75rem;color:#fff;flex-shrink:0}

.chat-area{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.chat-messages{flex:1;overflow-y:auto;padding:14px clamp(10px,2.5vw,24px);display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:min(88%,640px);padding:8px 12px;border-radius:12px;font-size:.82rem;line-height:1.55;overflow-wrap:anywhere;animation:fadeIn .2s both}
.msg.user{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--user-msg-grad-1),var(--user-msg-grad-2));border:1px solid rgba(255,255,255,.15);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-label{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:800;letter-spacing:.6px;color:var(--accent-2);margin-bottom:3px}
.ai-label::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.ai-body p+p{margin-top:5px}
.ai-body code{background:rgba(0,0,0,.15);padding:1px 4px;border-radius:4px;font-family:monospace;font-size:.78rem}
.ai-body ul{margin:4px 0 4px 16px}

.welcome{margin:auto;width:min(100%,420px);padding:14px 8px;text-align:center;animation:fadeIn .4s both}
.welcome h2{font-size:clamp(1.2rem,2.5vw,1.55rem);letter-spacing:-.9px;font-weight:800;line-height:1.2}
.welcome h2 span{background:linear-gradient(100deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome>p{max-width:320px;margin:6px auto 14px;color:var(--muted);font-size:.76rem;line-height:1.5}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;text-align:left}
.suggestion{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;text-align:left;transition:border-color .2s,transform .2s}
.suggestion:hover{border-color:var(--border-hover);transform:translateY(-1px)}
.suggestion strong{display:block;font-size:.72rem;margin-bottom:2px}
.suggestion span{display:block;font-size:.63rem;color:var(--muted);line-height:1.4}

.typing{align-self:flex-start;padding:7px 11px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:none;margin:0 16px 8px;align-items:center;gap:8px}
.typing.visible{display:flex}
.typing-label{font-size:.6rem;font-weight:800;letter-spacing:.5px;color:var(--accent-2)}
.typing-dots{display:flex;gap:3px}
.typing-dots span{width:4px;height:4px;background:var(--accent-2);border-radius:50%;animation:bounce 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-3px);opacity:1}}

.input-shell{padding:8px clamp(10px,2vw,20px) 8px;border-top:1px solid var(--border)}
.chat-input-area{max-width:820px;margin:0 auto;padding:5px;display:flex;align-items:flex-end;gap:5px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);transition:border-color .2s}
.chat-input-area:focus-within{border-color:var(--accent)}
.chat-input-area textarea{flex:1;min-width:0;padding:7px 9px;border:0;background:transparent;color:var(--text);font-size:.83rem;resize:none;outline:none;max-height:120px;min-height:34px;line-height:1.45}
.chat-input-area textarea::placeholder{color:var(--muted)}
.tts-btn,.attract-btn,.send-btn{height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;padding:0 9px;transition:transform .18s,background .18s,color .18s}
.tts-btn,.attract-btn{border:1px solid var(--border);background:var(--surface-3);color:var(--muted);font-size:.7rem;font-weight:600}
.tts-btn:hover,.attract-btn:hover{color:var(--text)}
.tts-btn.on,.attract-btn.on{border-color:var(--accent);color:var(--accent-2)}
.send-btn{width:34px;padding:0;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,var(--accent-grad-1),var(--accent-grad-2));color:#fff;font-size:.95rem}
.send-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}

.clear-history{font-size:.64rem;color:var(--muted);background:none;border:0;border-radius:5px;padding:3px 6px;cursor:pointer}
.clear-history:hover{color:var(--accent-2);background:rgba(255,255,255,.05)}
.history-list{display:flex;flex-direction:column;gap:5px}
.history-item{padding:7px 9px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:.7rem;transition:border-color .2s}
.history-item:hover{border-color:var(--border-hover)}
.history-item .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-empty{color:var(--muted);font-size:.7rem;text-align:center;margin-top:14px;line-height:1.5}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.topbar{height:38px;padding:0 10px;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.topbar-brand,.topbar-actions{gap:7px}
.topbar-logo-mark{width:22px;height:22px;border-radius:7px}
.topbar-logo-mark svg{width:13px;height:13px}
.topbar-logo{font-size:.86rem}
.topbar-logo span{font-size:.56rem;padding:1px 4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.user-chip{display:flex;align-items:center;gap:5px;max-width:120px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:2px 8px 2px 2px;color:var(--text);font-size:.68rem;font-weight:600;cursor:pointer}
.user-chip:hover{border-color:var(--border-hover)}
#display-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-avatar{width:18px;height:18px;border-radius:5px;font-size:.62rem}
.theme-picker-wrapper{gap:4px;padding:3px 6px;border-radius:7px}
.theme-dot{width:11px;height:11px}
.rate-page-link{padding:3px 8px;font-size:.64rem;border-radius:7px}
.main{flex:1;display:flex;min-height:0;background:var(--surface)}
.chat-area{flex:1}
.chat-messages{padding:8px 12px;gap:6px}
.msg{padding:5px 10px;font-size:.78rem;line-height:1.45;border-radius:10px;max-width:min(92%,720px)}
.ai-label{font-size:.54rem;margin-bottom:1px}
.ai-body p+p{margin-top:3px}
.welcome{padding:4px;width:min(100%,380px)}
.welcome h2{font-size:1.05rem;letter-spacing:-.5px}
.welcome>p{margin:3px auto 8px;font-size:.7rem;line-height:1.4}
.suggestions{gap:5px}
.suggestion{padding:5px 9px;border-radius:8px}
.suggestion strong{font-size:.68rem;margin:0}
.suggestion span{display:none}
.history-bar{display:flex;align-items:center;gap:6px;padding:3px 10px 0}
.history-bar:has(.history-empty){display:none}
.history-list{flex:1;flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
.history-item{flex:0 0 auto;max-width:160px;padding:2px 9px;border-radius:99px;font-size:.62rem}
.clear-history{font-size:.6rem;padding:2px 5px}
.typing{margin:0 12px 3px;padding:4px 9px;border-radius:9px}
.input-shell{padding:4px 8px 6px;border-top:0}
.chat-input-area{padding:3px;gap:3px;border-radius:10px}
.chat-input-area textarea{padding:5px 8px;min-height:28px;font-size:.8rem;line-height:1.4}
.tts-btn,.attract-btn,.send-btn{height:28px;border-radius:7px;padding:0 8px;font-size:.72rem}
.send-btn{width:28px;padding:0;font-size:.8rem}
@media(max-width:700px){.topbar{height:36px;padding:0 8px}.topbar-logo,.theme-picker-wrapper{display:none}.chat-messages{padding:6px 8px}.msg{max-width:96%}.input-shell{padding:3px 6px 5px}}
</style>
</head>
<body>
<div class="modal-overlay" id="name-modal">
  <div class="modal-card">
    <div class="modal-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="white"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/></svg>
    </div>
    <h2>Welcome to Ookwa</h2>
    <p>What should Ookwa call you?</p>
    <form class="modal-form" id="name-form">
      <div class="form-group">
        <label for="username-input">Your name or nickname</label>
        <input type="text" id="username-input" placeholder="e.g. Alex" required autocomplete="nickname">
      </div>
      <button type="submit" class="modal-btn">Start Chatting</button>
    </form>
  </div>
</div>

<div class="bg-motion" aria-hidden="true"><div class="bg-grid"></div><div class="bg-orb o1"></div><div class="bg-orb o2"></div><div class="bg-orb o3"></div></div>
<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div id="app">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="white"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/></svg></div>
      <div class="topbar-logo">Ookwa <span>1.0</span></div>
      <span class="status-dot" title="Live OpenRouter connected"></span>
    </div>
    <div class="topbar-actions">
      <button class="user-chip" id="change-name-btn" title="Change name"><span class="user-avatar" id="user-avatar">?</span><span id="display-name">Friend</span></button>
      <div class="theme-picker-wrapper" title="Select UI color theme">
        <div class="theme-dot active" data-set="red" title="Red"></div><div class="theme-dot" data-set="blue" title="Blue"></div><div class="theme-dot" data-set="purple" title="Purple"></div><div class="theme-dot" data-set="green" title="Green"></div><div class="theme-dot" data-set="cyan" title="Cyan"></div><div class="theme-dot" data-set="black" title="Black"></div><div class="theme-dot" data-set="white" title="White"></div>
      </div>
      <a class="rate-page-link" href="rating.html" aria-label="Rate this website">★ Rate</a>
      <a class="rate-page-link" href="mailto:kypton335@gmail.com" title="kypton335@gmail.com · Discord @oowa" aria-label="Email">✉</a>
    </div>
  </header>
  <main class="main">
    <section class="chat-area">
      <div class="chat-messages" id="messages">
        <div class="welcome" id="welcome">
          <h2>What can we <span id="welcome-name-span">figure out?</span></h2>
          <p>Ask a question, explore an idea, get help with code, or work through a problem.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Help me build a professional website"><strong>✦ Build something</strong></button>
            <button class="suggestion" data-prompt="Give me some creative ideas"><strong>✧ Brainstorm ideas</strong></button>
            <button class="suggestion" data-prompt="Explain something in simple terms"><strong>⌘ Learn something</strong></button>
            <button class="suggestion" data-prompt="Tell me a good joke"><strong>☻ Take a break</strong></button>
          </div>
        </div>
      </div>
      <div class="typing" id="typing"><span class="typing-label">OOKWA</span><div class="typing-dots"><span></span><span></span><span></span></div></div>
      <div class="history-bar"><div class="history-list" id="history-list"></div><button class="clear-history" id="clear-history">Clear</button></div>
      <div class="input-shell">
        <div class="chat-input-area">
          <textarea id="user-input" placeholder="Message Ookwa... (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
          <button class="attract-btn" id="attract-btn" title="Toggle particle magnetism">⊕</button>
          <button class="tts-btn" id="tts-btn" title="Toggle voice answers">🔇</button>
          <button class="send-btn" id="send-btn" aria-label="Send message">➤</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
// SECURITY: a key in browser code is public. Revoke the old one and proxy requests through a server.
const OPENROUTER_API_KEY = "YOUR_NEW_OPENROUTER_KEY";
const OPENROUTER_MODEL = "openai/gpt-4o-mini";
const $ = id => document.getElementById(id);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

let userName = store.get('ookwa_user_name', '');
let chatConversation = [];

// THEMES
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'red' ? '' : t);
  store.set('ookwa_theme', t);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.set === t));
}
document.querySelectorAll('.theme-dot').forEach(d => d.onclick = () => applyTheme(d.dataset.set));
applyTheme(store.get('ookwa_theme', 'red'));

// NAME
const nameModal = $('name-modal'), usernameInput = $('username-input');
function updateNameUI() {
  if (!userName) return nameModal.classList.remove('hidden');
  nameModal.classList.add('hidden');
  $('display-name').textContent = userName;
  $('user-avatar').textContent = userName.charAt(0).toUpperCase();
  const s = $('welcome-name-span');
  if (s) s.textContent = userName + '?';
}
updateNameUI();
$('name-form').onsubmit = e => {
  e.preventDefault();
  const v = usernameInput.value.trim();
  if (!v) return;
  userName = v;
  store.set('ookwa_user_name', v);
  updateNameUI();
};
$('change-name-btn').onclick = () => { usernameInput.value = userName; nameModal.classList.remove('hidden'); };

// PARTICLES
window.ookwaAttract = false;
(function () {
  const canvas = $('particle-canvas'), ctx = canvas.getContext('2d');
  if (!ctx) return;
  let w, h;
  const mouse = { x: -1000, y: -1000 }, ps = [];
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  for (let i = 0; i < (innerWidth < 700 ? 30 : 55); i++)
    ps.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: 1.2 + Math.random() * 1.8 });
  addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = mouse.y = -1000; });

  (function tick() {
    requestAnimationFrame(tick);
    if (document.hidden) return;
    ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement);
    const color = cs.getPropertyValue('--particle-color').trim() || '#fb646b';
    const rgb = cs.getPropertyValue('--particle-line-rgb').trim() || '239,68,68';
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      p.x = Math.max(0, Math.min(w, p.x)); p.y = Math.max(0, Math.min(h, p.y));
      const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (d < 130) {
        const s = (window.ookwaAttract ? .035 : -.04) * (1 - d / 130);
        p.vx += dx / d * s; p.vy += dy / d * s;
      }
      p.vx *= .98; p.vy *= .98;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 1.8) { p.vx = p.vx / sp * 1.8; p.vy = p.vy / sp * 1.8; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    }
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const d = Math.hypot(ps[i].x - ps[j].x, ps[i].y - ps[j].y);
      if (d < 115) {
        ctx.beginPath(); ctx.moveTo(ps[i].x, ps[i].y); ctx.lineTo(ps[j].x, ps[j].y);
        ctx.strokeStyle = `rgba(${rgb},${.18 * (1 - d / 115)})`; ctx.lineWidth = .8; ctx.stroke();
      }
    }
  })();
})();

const attractBtn = $('attract-btn');
attractBtn.onclick = () => {
  window.ookwaAttract = !window.ookwaAttract;
  attractBtn.classList.toggle('on', window.ookwaAttract);
  attractBtn.textContent = window.ookwaAttract ? '⊙' : '⊕';
};

// CHAT
const messagesEl = $('messages'), userInput = $('user-input'), typingEl = $('typing'), ttsBtn = $('tts-btn'), historyList = $('history-list');
let ttsOn = store.get('ookwa_tts', '0') === '1', history = [];
try { history = JSON.parse(store.get('ookwa_history', '[]')); } catch (e) {}

function updateTtsBtn() { ttsBtn.classList.toggle('on', ttsOn); ttsBtn.textContent = ttsOn ? '🔊' : '🔇'; }
updateTtsBtn();
ttsBtn.onclick = () => {
  ttsOn = !ttsOn; store.set('ookwa_tts', ttsOn ? '1' : '0'); updateTtsBtn();
  if (!ttsOn && window.speechSynthesis) speechSynthesis.cancel();
};

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[`#*_]/g, '').replace(/\n+/g, '. '));
  u.rate = 1.02;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v => /^en/i.test(v.lang) && /google|microsoft|samantha|daniel/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function generateAIResponse(query) {
  chatConversation.push({ role: 'user', content: query });
  try {
    const origin = location.origin && location.origin !== 'null' ? location.origin : 'http://localhost';
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENROUTER_API_KEY, 'HTTP-Referer': origin, 'X-Title': 'Ookwa AI' },
      body: JSON.stringify({
        model: OPENROUTER_MODEL,
        messages: [{ role: 'system', content: `You are Ookwa 1.0, a highly capable personal AI assistant created for ${userName || 'the user'}. Be concise, intelligent, encouraging, and clear.` }, ...chatConversation]
      })
    });
    if (!res.ok) { console.error('OpenRouter error:', await res.text()); throw new Error('API error: ' + res.status); }
    const reply = (await res.json()).choices[0].message.content;
    chatConversation.push({ role: 'assistant', content: reply });
    return reply;
  } catch (err) {
    console.error('OpenRouter AI Error:', err);
    return "I'm having trouble connecting right now. Check your internet connection and API key, run this file through a local web server (like Live Server), or see the browser console for details.";
  }
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function parseMarkdown(text) {
  const lines = esc(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').split('\n');
  let inList = false;
  return lines.map(line => {
    if (line.trim().startsWith('* ')) {
      const r = (inList ? '' : '<ul>') + `<li>${line.trim().slice(2)}</li>`;
      inList = true; return r;
    }
    const r = (inList ? '</ul>' : '') + (line ? `<p>${line}</p>` : '');
    inList = false; return r;
  }).join('') + (inList ? '</ul>' : '');
}

function appendMessage(text, sender) {
  const welcome = $('welcome');
  if (welcome) welcome.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + sender;
  if (sender === 'ai') { d.innerHTML = `<div class="ai-label">OOKWA</div><div class="ai-body">${parseMarkdown(text)}</div>`; speakText(text); }
  else d.textContent = text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderHistory() {
  historyList.innerHTML = history.length ? '' : '<div class="history-empty">Your recent questions will appear here.</div>';
  history.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item';
    el.innerHTML = `<div class="q">${esc(item.q)}</div><div class="time">${esc(item.time)}</div>`;
    el.onclick = () => { userInput.value = item.q; userInput.focus(); };
    historyList.appendChild(el);
  });
}
renderHistory();

$('clear-history').onclick = () => { history = []; store.set('ookwa_history', '[]'); renderHistory(); };

async function handleSend() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = ''; userInput.style.height = 'auto';
  appendMessage(text, 'user');
  history.unshift({ q: text, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
  history = history.slice(0, 15);
  store.set('ookwa_history', JSON.stringify(history)); renderHistory();
  typingEl.classList.add('visible');
  messagesEl.scrollTop = messagesEl.scrollHeight;
  const reply = await generateAIResponse(text);
  typingEl.classList.remove('visible');
  appendMessage(reply, 'ai');
}
$('send-btn').onclick = handleSend;
userInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };
userInput.oninput = () => { userInput.style.height = 'auto'; userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px'; };
document.querySelectorAll('.suggestion').forEach(b => b.onclick = () => { userInput.value = b.dataset.prompt; handleSend(); });

</script>
</body>
</html>
